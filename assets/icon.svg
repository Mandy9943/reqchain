<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
  <title>reqchain</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Cuts a gap out of the first link exactly where the second one crosses it,
         so the crossing reads as interlocked instead of merged. A mask is used
         rather than a background-coloured halo so the gap stays correct over the
         gradient. -->
    <mask id="crossing">
      <rect width="128" height="128" fill="#FFFFFF"/>
      <rect x="62" y="47" width="54" height="34" rx="17"
            fill="none" stroke="#000000" stroke-width="27"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Two chain links: the second derives from the first, which is what the app
       is about — one request taking its credential from another. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <rect x="12" y="47" width="54" height="34" rx="17" mask="url(#crossing)"/>
    <rect x="62" y="47" width="54" height="34" rx="17"/>
  </g>
</svg>
