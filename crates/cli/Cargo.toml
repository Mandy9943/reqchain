[package]
name = "reqchain-cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "reqchain"
path = "src/main.rs"

[dependencies]
reqchain-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
serde_json.workspace = true
chrono = "0.4"
md5_simple = { package = "md5", version = "0.7" }
